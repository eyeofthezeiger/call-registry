# Where the update routine reads each provider. Public, official sources only.
# Prefer machine-readable specs; fall back to docs pages. Respect robots.txt and terms.
# reachable: whether the source loaded from the cloud session on 2026-11-07.
google-workspace:
  - kind: discovery
    url: https://gmail.googleapis.com/$discovery/rest?version=v1
    reachable: true
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest
    reachable: true
  - kind: discovery
    url: https://www.googleapis.com/discovery/v1/apis/drive/v3/rest
    reachable: true
  - kind: discovery
    url: https://docs.googleapis.com/$discovery/rest?version=v1
    reachable: true
  - kind: discovery
    url: https://sheets.googleapis.com/$discovery/rest?version=v4
    reachable: true
github:
  - kind: openapi
    url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    reachable: true
  - kind: readme
    url: https://raw.githubusercontent.com/github/github-mcp-server/main/README.md
    reachable: true
figma:
  - kind: readme
    url: https://github.com/figma/mcp-server-guide
    reachable: true
    note: git clone works. Skills show MCP calls with argument names; mcp.json lists every tool name.
  - kind: openapi
    url: https://raw.githubusercontent.com/figma/rest-api-spec/main/openapi/openapi.yaml
    reachable: true
  - kind: docs-page
    url: https://developers.figma.com/docs/figma-mcp-server/tools-and-prompts/
    reachable: true
slack:
  - kind: docs-page
    url: https://docs.slack.dev/reference/methods/
    reachable: true
    note: One page per method. Pages loaded through a fetch tool, not curl.
  - kind: docs-page
    url: https://docs.slack.dev/ai/slack-mcp-server
    reachable: true
    note: Lists features by area, not every tool name. Use the server's tools/list.
  - kind: readme
    url: https://github.com/slackapi/slack-skills-plugin
    reachable: true
    note: git clone works. Skills and commands name the MCP tools and some arguments.
atlassian:
  - kind: docs-page
    url: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/
    reachable: true
  - kind: openapi
    url: https://developer.atlassian.com/cloud/jira/platform/swagger-v3.v3.json
    reachable: false
    note: Loaded but came back cut off (schemas only, no paths). REST pages are JS-rendered. Try from a normal machine.
  - kind: openapi
    url: https://developer.atlassian.com/cloud/confluence/openapi-v2.v3.json
    reachable: false
    note: Same as Jira.
  - kind: readme
    url: https://github.com/atlassian/atlassian-mcp-server
    reachable: true
    note: git clone works. The skills/ folder shows MCP call examples with argument names.
  - kind: docs-page
    url: https://developer.atlassian.com/cloud/jira/platform/rate-limiting/
    reachable: true
    note: Readable. Names priced endpoints, 429 headers and quotas.
  - kind: docs-page
    url: https://developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/
    reachable: true
  - kind: docs-page
    url: https://developer.atlassian.com/cloud/confluence/basic-auth-for-rest-apis/
    reachable: true
  - kind: docs-page
    url: https://developer.atlassian.com/cloud/confluence/rate-limiting/
    reachable: true
  - kind: openapi
    url: https://developer.atlassian.com/cloud/confluence/swagger.v3.json
    reachable: true
    note: Confluence v1 spec, served cut off before the end (about 110K characters). Has content/search.
  - kind: docs-page
    url: https://developer.atlassian.com/platform/forge/apis-reference/fetch-api-product.requestconfluence/
    reachable: true
    note: Forge docs render. Their code samples show v2 calls and the scopes they need.
  - kind: sdk
    url: https://www.npmjs.com/package/@atlassian-pi/jira-pi-client
    reachable: true
    note: Atlassian's own Jira REST client (npm pack works). Shows method, path and params it sends.
